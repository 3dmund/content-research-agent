<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Library</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0a0a; color: #fff;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .muted { color: rgba(255,255,255,.4); }

  /* Library */
  .library { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; padding: 24px; }
  .filters {
    width: 260px; flex: none; align-self: flex-start; position: sticky; top: 24px;
    background: #111; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 16px;
  }
  .brand { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
  .label {
    display: block; margin: 16px 0 6px; font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.45);
  }
  .field {
    width: 100%; padding: 8px 10px; border-radius: 8px; color: #fff; font: inherit; font-size: 13px;
    background: #1c1c1c; border: 1px solid rgba(255,255,255,.1); outline: none;
  }
  .field:focus { border-color: rgba(255,255,255,.3); }
  .main { flex: 1; min-width: 0; }
  .toolbar { display: flex; align-items: center; margin-bottom: 12px; font-size: 13px; color: rgba(255,255,255,.4); }
  .toolbar .field { width: auto; margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .card {
    display: block; overflow: hidden; border-radius: 12px; background: #1c1c1c;
    border: 1px solid rgba(255,255,255,.08); transition: transform .15s, border-color .15s;
  }
  .card:hover { border-color: rgba(255,255,255,.2); transform: scale(1.01); }
  .thumb { position: relative; aspect-ratio: 9 / 16; background: #161616; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), transparent 45%); }
  .play {
    position: absolute; inset: 0; margin: auto; z-index: 1; width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s;
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(4px);
  }
  .card:hover .play { opacity: 1; }
  .pill {
    position: absolute; top: 8px; z-index: 1; padding: 2px 8px; border-radius: 99px;
    font-size: 10px; font-weight: 700; white-space: nowrap;
  }
  .pill.creator { left: 8px; max-width: 62%; overflow: hidden; text-overflow: ellipsis; }
  .pill.type { right: 8px; background: rgba(0,0,0,.6); }
  .status {
    position: absolute; left: 8px; bottom: 8px; z-index: 1; padding: 2px 8px; border-radius: 99px;
    font-size: 11px; font-weight: 600; background: rgba(251,191,36,.18); color: #fcd34d;
  }
  .card-body { padding: 8px 10px 10px; }
  .card-title { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: rgba(255,255,255,.4); }
  .chips { display: flex; gap: 4px; margin-top: 6px; }
  .chip { padding: 2px 6px; border-radius: 6px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.likes { background: rgba(56,189,248,.15); color: #7dd3fc; }
  .chip.comments { background: rgba(251,146,60,.15); color: #fdba74; }
  .empty { padding: 96px 24px; text-align: center; color: rgba(255,255,255,.45); }
  .empty code { padding: 2px 6px; border-radius: 6px; background: #1c1c1c; color: #fff; }

  /* Video page */
  .video-page { display: flex; flex-direction: column; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 32px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .topbar .back { font-size: 13px; color: rgba(255,255,255,.4); }
  .topbar .back:hover, .topbar .external:hover { color: #fff; }
  .topbar strong { font-size: 14px; }
  .topbar .external { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.4); }
  .panes { display: flex; flex: 1; min-height: 0; }
  .stage { width: 380px; flex: none; padding: 24px; overflow-y: auto; border-right: 1px solid rgba(255,255,255,.08); }
  .stage video { display: block; width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
  .stat { padding: 12px; border-radius: 6px; background: #1c1c1c; border: 1px solid rgba(255,255,255,.08); }
  .stat b { display: block; font-size: 18px; font-weight: 600; }
  .stat span { font-size: 12px; color: rgba(255,255,255,.4); }
  .content { flex: 1; min-width: 0; overflow-y: auto; padding: 0 32px 32px; }
  .column { max-width: 768px; }
  .jump {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; overflow-x: auto;
    margin: 0 -32px 24px; padding: 10px 32px; background: rgba(10,10,10,.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .jump button { flex: none; padding: 4px 10px; border-radius: 99px; font-size: 12px; color: rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.1); }
  .jump button:hover { color: #fff; border-color: rgba(255,255,255,.25); }
  .jump button.on { background: #fff; border-color: #fff; color: #000; }
  details.section { margin-bottom: 16px; scroll-margin-top: 64px; background: #111; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; }
  details.section > summary { display: flex; align-items: center; gap: 8px; padding: 14px 20px; cursor: pointer; list-style: none; user-select: none; font-size: 14px; font-weight: 600; }
  details.section > summary::-webkit-details-marker { display: none; }
  summary .meta { font-size: 12px; font-weight: 400; color: rgba(255,255,255,.35); }
  summary .chev { margin-left: auto; color: rgba(255,255,255,.3); transition: transform .15s; }
  details[open] > summary .chev { transform: rotate(180deg); }
  .section-body { padding: 0 20px 20px; font-size: 14px; color: rgba(255,255,255,.85); }
  .pre { margin: 0; white-space: pre-wrap; }
  .line { display: flex; gap: 10px; padding: 2px 0; }
  .stamp { flex: none; font: 12px/21px ui-monospace, SFMono-Regular, Menlo, monospace; color: #7dd3fc; }
  .stamp:hover { color: #fff; }
  .field-card { margin-bottom: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,.08); border-left-width: 2px; }
  .field-card h4 { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .field-card p { margin: 0; white-space: pre-line; }
  .tone-hook { border-left-color: rgba(56,189,248,.6); background: rgba(56,189,248,.04); }
  .tone-why { border-left-color: rgba(251,191,36,.6); background: rgba(251,191,36,.04); }
  .tone-steal { border-left-color: rgba(167,139,250,.6); background: rgba(167,139,250,.04); }
  .tone-format { border-left-color: rgba(52,211,153,.6); background: rgba(52,211,153,.04); }
  .ideas { margin: 0; padding: 0; list-style: none; }
  .ideas li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ideas li:last-child { border-bottom: 0; }
  .ideas .n { flex: none; width: 20px; color: rgba(255,255,255,.3); font-variant-numeric: tabular-nums; }
  .ideas li.top { color: #fff; font-weight: 500; }
  .frames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .frames button { display: block; overflow: hidden; border-radius: 8px; border: 1px solid rgba(255,255,255,.08); }
  .frames button:hover { border-color: rgba(255,255,255,.3); }
  .frames img { display: block; width: 100%; }
  .pending { padding: 16px; border-radius: 8px; background: #1c1c1c; color: rgba(255,255,255,.5); }

  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    .library { flex-direction: column; padding: 16px; }
    .filters { width: 100%; position: static; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .video-page { height: auto; }
    .panes { flex-direction: column; }
    .stage { width: 100%; border-right: 0; padding: 16px; }
    .topbar { padding: 12px 16px; }
    .content { overflow: visible; padding: 0 16px 24px; }
    .jump { margin: 0 -16px 16px; padding: 10px 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById("app");
const state = { reels: [], query: "", creator: "", sort: "saved" };
const GRADIENTS = [
  ["#f59e0b", "#ef4444"], ["#38bdf8", "#6366f1"], ["#34d399", "#0ea5e9"],
  ["#f472b6", "#8b5cf6"], ["#a3e635", "#14b8a6"], ["#fb923c", "#ec4899"],
];

// Captions and transcripts come from strangers, so everything is escaped before it reaches the page.
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(value) { return esc(value).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
function safeLink(url) { return /^https:\/\/(www\.)?instagram\.com\//.test(url || "") ? url : "#"; }
function media(reel, file) { return `/media/${encodeURIComponent(reel.id)}/${file}`; }
function count(n) {
  if (n === null || n === undefined) return "—";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "K";
  return String(n);
}
function length(s) {
  if (!s) return "";
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m ? `${m}:${String(r).padStart(2, "0")}` : `${r}s`;
}
function gradient(name) {
  let hash = 0;
  for (const c of name || "") hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  const [a, b] = GRADIENTS[hash % GRADIENTS.length];
  return `background:linear-gradient(to right,${a},${b})`;
}

function parseAnalysis(markdown) {
  const out = { title: "", sections: {} };
  let current = null;
  for (const raw of (markdown || "").split("\n")) {
    const line = raw.trimEnd();
    if (/^#\s/.test(line) && !out.title) { out.title = line.replace(/^#\s+/, ""); continue; }
    const heading = line.match(/^##\s+(.*)/);
    if (heading) { current = heading[1].trim().toLowerCase(); out.sections[current] = []; continue; }
    if (current) out.sections[current].push(line);
  }
  for (const key in out.sections) out.sections[key] = out.sections[key].join("\n").trim();
  return out;
}
function displayTitle(reel) {
  const parsed = parseAnalysis(reel.analysis);
  const title = parsed.title.replace(/^[^:]*:\s*/, "");
  return title || (reel.caption || "").split("\n")[0] || "Untitled";
}

function visibleReels() {
  const terms = state.query.toLowerCase().split(/\s+/).filter(Boolean);
  const list = state.reels.filter((reel) => {
    if (state.creator && reel.creator !== state.creator) return false;
    const haystack = [reel.creator, reel.caption, reel.transcript, reel.analysis].join(" ").toLowerCase();
    return terms.every((term) => haystack.includes(term));
  });
  if (state.sort === "likes") list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
  if (state.sort === "comments") list.sort((a, b) => (b.comments || 0) - (a.comments || 0));
  return list;
}

function cardHtml(reel) {
  const thumb = reel.frames[0] ? `<img src="${media(reel, "frames/" + reel.frames[0])}" alt="" loading="lazy">` : "";
  return `<a class="card" href="#/reel/${encodeURIComponent(reel.id)}">
    <div class="thumb">${thumb}
      <span class="pill creator" style="${gradient(reel.creator)}">@${esc(reel.creator)}</span>
      <span class="pill type">Reel · ${esc(length(reel.duration_seconds))}</span>
      <span class="play">▶</span>
      ${reel.analysis ? "" : '<span class="status">Not analyzed yet</span>'}
    </div>
    <div class="card-body">
      <p class="card-title">${esc(displayTitle(reel))}</p>
      <div class="card-meta"><span>@${esc(reel.creator)}</span><span>${esc(reel.saved)}</span></div>
      <div class="chips"><span class="chip likes">♥ ${count(reel.likes)}</span><span class="chip comments">💬 ${count(reel.comments)}</span></div>
    </div>
  </a>`;
}

function renderGrid() {
  const list = visibleReels();
  document.getElementById("count").textContent = `Showing ${list.length.toLocaleString()}`;
  document.getElementById("grid").innerHTML = list.length
    ? `<div class="grid">${list.map(cardHtml).join("")}</div>`
    : state.reels.length
      ? '<div class="empty">No reels match that search.</div>'
      : '<div class="empty">Your library is empty.<br><br>In Claude Code, type <code>/analyze</code> followed by a reel link.</div>';
}

function renderLibrary() {
  const creators = [...new Set(state.reels.map((r) => r.creator))].sort();
  document.title = "Research Library";
  app.innerHTML = `<div class="library">
    <aside class="filters">
      <h1 class="brand">Research Library</h1>
      <label class="label" for="q">Search</label>
      <input id="q" class="field" placeholder="Hooks, topics, creators…" value="${esc(state.query)}">
      <label class="label" for="creator">Creator</label>
      <select id="creator" class="field">
        <option value="">All creators</option>
        ${creators.map((c) => `<option value="${esc(c)}" ${c === state.creator ? "selected" : ""}>@${esc(c)}</option>`).join("")}
      </select>
    </aside>
    <main class="main">
      <div class="toolbar"><span id="count"></span>
        <select id="sort" class="field" aria-label="Sort">
          <option value="saved" ${state.sort === "saved" ? "selected" : ""}>Recently saved</option>
          <option value="likes" ${state.sort === "likes" ? "selected" : ""}>Most likes</option>
          <option value="comments" ${state.sort === "comments" ? "selected" : ""}>Most comments</option>
        </select>
      </div>
      <div id="grid"></div>
    </main>
  </div>`;
  document.getElementById("q").addEventListener("input", (e) => { state.query = e.target.value; renderGrid(); });
  document.getElementById("creator").addEventListener("change", (e) => { state.creator = e.target.value; renderGrid(); });
  document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderGrid(); });
  renderGrid();
}

function section(id, emoji, title, meta, body) {
  return `<details class="section" id="${id}" open>
    <summary><span>${emoji}</span><span>${title}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}<span class="chev">⌄</span></summary>
    <div class="section-body">${body}</div>
  </details>`;
}
function fieldCard(label, emoji, tone, text) {
  return text ? `<div class="field-card ${tone}"><h4>${emoji} ${label}</h4><p>${inline(text)}</p></div>` : "";
}
function transcriptHtml(text) {
  const lines = (text || "").split("\n").filter((l) => l.trim());
  if (!lines.length) return '<p class="muted">No speech in this reel.</p>';
  return lines.map((line) => {
    const m = line.match(/^\[(\d+):(\d+)\]\s*(.*)$/);
    if (!m) return `<div class="line">${esc(line)}</div>`;
    const seconds = Number(m[1]) * 60 + Number(m[2]);
    return `<div class="line"><button class="stamp" data-seek="${seconds}">${m[1]}:${m[2]}</button><span>${esc(m[3])}</span></div>`;
  }).join("");
}
function ideasHtml(text) {
  const items = (text || "").split("\n").map((l) => l.trim()).filter((l) => /^\d+[.)]/.test(l));
  if (!items.length) return `<p class="pre">${inline(text)}</p>`;
  return `<ol class="ideas">${items.map((line) => {
    const m = line.match(/^(\d+)[.)]\s*(.*)$/);
    return `<li class="${line.includes("⭐") ? "top" : ""}"><span class="n">${m[1]}</span><span>${inline(m[2])}</span></li>`;
  }).join("")}</ol>`;
}

function renderReel(id) {
  const reel = state.reels.find((r) => r.id === id);
  if (!reel) { location.hash = "#/"; return; }
  const a = parseAnalysis(reel.analysis);
  const s = a.sections;
  const lines = (reel.transcript || "").split("\n").filter((l) => l.trim()).length;
  const nav = [["caption", "💬 Caption"], ["transcript", "📝 Transcript"], ["breakdown", "🧠 Breakdown"], ["ideas", "💡 Ideas"], ["frames", "🎞️ Frames"]];
  const pending = '<p class="pending">Not analyzed yet. In Claude Code, type <code>/analyze</code> with this reel’s link.</p>';
  const step = reel.duration_seconds && reel.frames.length ? reel.duration_seconds / reel.frames.length : 0;
  document.title = `${reel.creator} · Research Library`;
  app.innerHTML = `<div class="video-page">
    <header class="topbar">
      <a class="back" href="#/">← Back</a>
      <strong>@${esc(reel.creator)}</strong>
      <span class="muted">${esc(reel.saved)}</span>
      <a class="external" href="${esc(safeLink(reel.url))}" target="_blank" rel="noopener noreferrer">View on Instagram ↗</a>
    </header>
    <div class="panes">
      <div class="stage">
        <video id="player" controls preload="metadata" poster="${reel.frames[0] ? media(reel, "frames/" + reel.frames[0]) : ""}" src="${media(reel, "video.mp4")}"></video>
        <div class="stats">
          <div class="stat"><b>${count(reel.likes)}</b><span>likes</span></div>
          <div class="stat"><b>${count(reel.comments)}</b><span>comments</span></div>
          <div class="stat"><b>${esc(length(reel.duration_seconds)) || "—"}</b><span>length</span></div>
        </div>
      </div>
      <div class="content" id="content"><div class="column">
        <nav class="jump">${nav.map(([k, label], i) => `<button data-jump="${k}" class="${i ? "" : "on"}">${label}</button>`).join("")}</nav>
        ${section("caption", "💬", "Caption", "", `<p class="pre">${esc(reel.caption)}</p>`)}
        ${section("transcript", "📝", "Transcript", lines ? `${lines} lines` : "", transcriptHtml(reel.transcript))}
        ${section("breakdown", "🧠", "Breakdown", "", reel.analysis
          ? fieldCard("Hook", "🪝", "tone-hook", s["hook"]) + fieldCard("Why it worked", "📈", "tone-why", s["why it worked"]) + fieldCard("Format", "🧩", "tone-format", s["format"]) + fieldCard("What to steal", "🎯", "tone-steal", s["what to steal"])
          : pending)}
        ${section("ideas", "💡", "Ideas for your page", "", reel.analysis ? ideasHtml(s["ideas for my page"]) : pending)}
        ${section("frames", "🎞️", "Frames", "click to jump", `<div class="frames">${reel.frames.map((f, i) => `<button data-seek="${step * i}"><img src="${media(reel, "frames/" + f)}" alt="Frame ${i + 1}" loading="lazy"></button>`).join("")}</div>`)}
      </div></div>
    </div>
  </div>`;

  const player = document.getElementById("player");
  app.querySelectorAll("[data-seek]").forEach((el) => el.addEventListener("click", () => {
    player.currentTime = Number(el.dataset.seek);
    player.play();
  }));
  app.querySelectorAll("[data-jump]").forEach((el) => el.addEventListener("click", () => {
    const target = document.getElementById(el.dataset.jump);
    target.open = true;
    target.scrollIntoView({ block: "start" });
  }));

  // Keep the jump bar on whichever section you're reading.
  const content = document.getElementById("content");
  content.addEventListener("scroll", () => {
    let active = nav[0][0];
    for (const [key] of nav) {
      if (document.getElementById(key).getBoundingClientRect().top <= 140) active = key;
    }
    app.querySelectorAll("[data-jump]").forEach((b) => b.classList.toggle("on", b.dataset.jump === active));
  });
}

function route() {
  const match = location.hash.match(/^#\/reel\/(.+)$/);
  window.scrollTo(0, 0);
  if (match) renderReel(decodeURIComponent(match[1]));
  else renderLibrary();
}

async function load() {
  const response = await fetch("/api/reels");
  state.reels = await response.json();
}

// New reels show up when you come back to this tab, without interrupting a video page.
window.addEventListener("focus", async () => {
  await load();
  if (!location.hash.startsWith("#/reel/")) renderGrid();
});
window.addEventListener("hashchange", route);
load().then(route);
</script>
</body>
</html>
